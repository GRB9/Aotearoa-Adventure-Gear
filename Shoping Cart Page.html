<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

/* HEADER */
.main-header {
    position: sticky;
    top: 0;
    background: #2F4F4F;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f3333;
    z-index: 1000;
}

.brand a {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 16px;
}

.brand img {
    height: 45px;
    margin-right: 10px;
}

.nav-links {
    display: flex;
    align-items: center;
}

.nav-links a {
    margin: 0 8px;
    text-decoration: none;
    color: white;
    font-size: 14px;
}

.nav-links a:hover {
    color: #FFD700;
}

.nav-links span {
    color: #dcdcdc;
    font-size: 14px;
}

.cart-btn {
    background: #1f3333;
    color: white !important;
    padding: 6px 14px;
    border-radius: 4px;
}

/* LAYOUT */
.container {
    width: 80%;
    margin: 30px auto;
}

.steps {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
    color: #aaa;
}

.steps .active {
    color: #000;
    border-bottom: 2px solid #000;
}

/* CONTENT */
.content {
    display: flex;
    gap: 30px;
}

.cart,
.summary {
    background: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

.cart {
    flex: 2;
}

.summary {
    flex: 1;
}

/* PRODUCTS */
.product {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
}

.product img {
    width: 80px;
    height: 120px;
    object-fit: cover;
    margin-right: 20px;
}

.product-details {
    flex: 1;
}

.qty input {
    width: 50px;
    padding: 5px;
}

/* BUTTONS */
.buttons {
    margin-top: 20px;
}

.btn {
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

.btn-primary {
    background: #2F4F4F;
    color: #fff;
}

.btn-primary:hover {
    background: #1f3333;
}

.btn-secondary {
    background: #ccc;
}

.btn-secondary:hover {
    background: #999;
    color: white;
}

/* SUMMARY */
.summary p {
    display: flex;
    justify-content: space-between;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    margin-top: 50px;
    color: white;
    background: #2F4F4F;
    border-top: 1px solid #1f3333;
}

.footer-links {
    margin-bottom: 10px;
}

.footer-links a {
    text-decoration: none;
    color: white;
    margin: 0 5px;
}

.footer-links a:hover {
    color: #FFD700;
}

.footer-links span {
    color: #dcdcdc;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="main-header">
    <div class="brand">
        <a href="#">
            <img src="images/logo.png" alt="Logo">
            <span>Aotearoa Adventure Gear</span>
        </a>
    </div>

    <nav class="nav-links">
        <a href="#">Home</a>
        <span>|</span>

        <a href="#">About</a>
        <span>|</span>

        <a href="#">Shop</a>
        <span>|</span>

        <a href="#">Help</a>
        <span>|</span>

        <a href="#" class="cart-btn">Your Cart</a>
    </nav>
</header>

<div class="container">

    <!-- STEPS -->
    <div class="steps">
        <div class="active">1. Shopping Cart</div>
        <div>2. Shipping Details</div>
        <div>3. Payment Options</div>
    </div>

    <div class="content">

        <!-- CART -->
        <div class="cart">
            <h2>Shopping Cart</h2>

            <!-- PRODUCT 1 -->
            <div class="product">
                <img src="images/Tent.jpg" alt="Tent">

                <div class="product-details">
                    <h4>Tent</h4>
                    <p>$250</p>
                </div>

                <div class="qty">
                    <input type="number" value="1" min="1" data-price="250">
                </div>
            </div>

            <!-- PRODUCT 2 -->
            <div class="product">
                <img src="images/Backpack.jpg" alt="Backpack">

                <div class="product-details">
                    <h4>Backpack</h4>
                    <p>$120</p>
                </div>

                <div class="qty">
                    <input type="number" value="1" min="1" data-price="120">
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="buttons">
                <button class="btn btn-primary">Next</button>
                <button class="btn btn-secondary">Cancel</button>
            </div>
        </div>

        <!-- SUMMARY -->
        <div class="summary">
            <h3>Summary</h3>

            <p>
                <span>Subtotal</span>
                <span id="subtotal">$370.00</span>
            </p>

            <p>
                <span>Shipping</span>
                <span>Free</span>
            </p>

            <p>
                <span>Taxes</span>
                <span id="tax">$37.00</span>
            </p>

            <hr>

            <p>
                <strong>Total</strong>
                <strong id="total">$407.00</strong>
            </p>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>

    <div class="footer-links">
        <a href="#">Home</a>
        <span>|</span>

        <a href="#">About</a>
        <span>|</span>

        <a href="#">Shop</a>
        <span>|</span>

        <a href="#">Help</a>
    </div>

    <p>© Aotearoa Adventure Gear</p>

</footer>

<script>
// UPDATE TOTAL FUNCTION
function updateCart() {
    let subtotal = 0;

    document.querySelectorAll(".qty input").forEach(input => {
        const price = parseFloat(input.dataset.price);
        const qty = parseInt(input.value) || 0;

        subtotal += price * qty;
    });

    const tax = subtotal * 0.1;
    const total = subtotal + tax;

    document.getElementById("subtotal").textContent =
        "$" + subtotal.toFixed(2);

    document.getElementById("tax").textContent =
        "$" + tax.toFixed(2);

    document.getElementById("total").textContent =
        "$" + total.toFixed(2);
}

// LISTEN FOR CHANGES
document.querySelectorAll(".qty input").forEach(input => {
    input.addEventListener("input", updateCart);
});
</script>

</body>
</html>
